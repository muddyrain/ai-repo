services:
  api:
    image: oven/bun:1.3.13
    working_dir: /app
    command: ["bun", "run", "--cwd", "services/api", "dev"]
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 5s

  web:
    image: oven/bun:1.3.13
    working_dir: /app
    command: ["bun", "run", "--cwd", "clients/web", "dev", "--", "-p", "3000"]
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
